<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Stash Guard</title>
  <meta name="description" content="Keep a list of the Diablo 3 legendaries, set items and gems you're hunting, so you never salvage them by accident.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <canvas id="embers" class="embers" aria-hidden="true"></canvas>

  <header class="topbar">
    <a class="brand" href="./">
      <svg class="brand__mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4.5 5.5v5.8c0 4.7 3.2 8.6 7.5 10.2 4.3-1.6 7.5-5.5 7.5-10.2V5.5z"/><path d="M12 7v9M8.5 10.5h7"/></svg>
      Stash Guard
    </a>
    <button type="button" class="search-trigger" data-open-search>
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <span class="search-trigger__label">Search items</span>
      <kbd>/</kbd>
    </button>
  </header>

  <main class="page">
    <section class="intro">
      <h1>Don't salvage that.</h1>
      <p id="summary" class="summary"></p>
    </section>

    <div id="filters" class="filters" role="group" aria-label="Filter by quality">
      <button type="button" class="filter" data-filter="all">All <span class="count">0</span></button>
      <button type="button" class="filter quality-legendary" data-filter="legendary">Legendary <span class="count">0</span></button>
      <button type="button" class="filter quality-set" data-filter="set">Set <span class="count">0</span></button>
      <button type="button" class="filter quality-gem" data-filter="gem">Gems <span class="count">0</span></button>
    </div>

    <div id="empty" class="empty" hidden>
      <svg class="empty__mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 4.5 5.5v5.8c0 4.7 3.2 8.6 7.5 10.2 4.3-1.6 7.5-5.5 7.5-10.2V5.5z"/></svg>
      <p id="empty-title" class="empty__title"></p>
      <p class="empty__hint">Add the legendaries, set pieces and gems you're hunting.<span class="tip"> Or just start typing.</span></p>
      <button type="button" class="button button--primary" data-open-search>Add an item</button>
    </div>

    <ul id="my-list" class="grid"></ul>
  </main>

  <footer class="footer">
    <span>Your list lives in this browser.</span>
    <button id="export" type="button" class="link-button">Export backup</button>
    <label class="link-button">Import<input id="import" type="file" accept=".json,application/json" class="visually-hidden"></label>
  </footer>

  <button type="button" class="fab" data-open-search aria-label="Add an item">
    <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <dialog id="palette" class="palette" aria-label="Search items">
    <div class="palette__field">
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="search" type="text" role="combobox" aria-controls="results" aria-expanded="true" aria-autocomplete="list"
             placeholder="Search legendaries, sets, gems…" autocomplete="off" spellcheck="false">
      <button type="button" class="palette__close" data-close-palette>Esc</button>
    </div>
    <ul id="results" class="palette__results" role="listbox" aria-label="Items"></ul>
    <p id="palette-hint" class="palette__hint"></p>
    <div class="palette__keys" aria-hidden="true">
      <span><kbd>↑</kbd><kbd>↓</kbd> choose</span>
      <span><kbd>Enter</kbd> add / remove</span>
      <span><kbd>Esc</kbd> close</span>
    </div>
  </dialog>

  <p id="status" class="status" role="status" hidden></p>
</body>
</html>
